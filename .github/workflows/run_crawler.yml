name: Auto TTU Crawler

on:
  schedule:
    - cron: '30 12 * * *' 
  
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run crawler script
        run: python ttu_all_pages_crawler.py

      - name: Commit and push crawler results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt *.xlsx ttu_all_pages/ ttu_announcements/ || true
          git commit -m "Auto-update crawler results [skip ci]" || exit 0
          git push