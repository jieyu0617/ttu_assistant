name: Auto TTU Crawler

on:
  schedule:
    - cron: '30 12 * * *' 
  
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run crawler script
        run: python ttu_all_pages_crawler.py

      # ====== 關鍵：手動將爬到的檔案打包成標準 zip 檔再上傳 ======
      - name: Zip crawler results
        run: |
          mkdir -p output_data
          cp *.txt *.xlsx output_data/ 2>/dev/null || true
          cp -r ttu_all_pages ttu_announcements output_data/ 2>/dev/null || true
          cd output_data && zip -r ../ttu-data.zip .

      - name: Upload crawler results
        uses: actions/upload-artifact@v4
        with:
          name: ttu-crawler-data
          path: ttu-data.zip