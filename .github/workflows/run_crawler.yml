name: Auto TTU Crawler

on:
  schedule:
    - cron: '0 3 * * *' 
  
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run crawler
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf python-docx openpyxl python-pptx
          python ttu_all_pages_crawler.py